name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: dotnet build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      # Warnings are errors via Directory.Build.props.
      - run: dotnet build AkironCommerce.sln --configuration Release

  test:
    name: dotnet test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      # No services: block — the integration tests start their own PostgreSQL through
      # Testcontainers, using the Docker daemon the runner already has.
      - run: dotnet test AkironCommerce.sln --configuration Release

  docker:
    name: docker build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Services/Catalog/Akiron.Catalog.Api/Dockerfile
          push: false
          load: true
          tags: akiron-catalog:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # A built image is not a working one: this boots it against a real PostgreSQL and
      # waits for readiness, which only passes once migrations have created the tables.
      # Development is what turns startup migrations (and the seed) on.
      - name: smoke test the image
        run: |
          docker network create smoke
          docker run -d --name smoke-db --network smoke \
            -e POSTGRES_USER=akiron -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=akiron_catalog \
            postgres:16-alpine
          # Over TCP on purpose: the entrypoint's temporary init server answers on the
          # socket only, and would pass a socket check just before it restarts.
          until docker exec smoke-db pg_isready -h 127.0.0.1 -U akiron -d akiron_catalog; do sleep 1; done
          docker run -d --name smoke-api --network smoke -p 8080:8080 \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e "ConnectionStrings__CatalogDb=Host=smoke-db;Database=akiron_catalog;Username=akiron;Password=smoke" \
            akiron-catalog:ci
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:8080/health/ready; then
              curl -sf "http://localhost:8080/api/v1/products?pageSize=1" > /dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs smoke-api
          exit 1

  compose-validate:
    name: compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/compose/docker-compose.infra.yml config --quiet
